name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit tests
        run: pytest -v

  docker-test:
    name: Build & Test Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (PR validation)
        run: |
          docker build -t simple-python-app:pr-${{ github.event.pull_request.number }} .

      - name: Test Docker container execution (Smoke Test)
        run: |
          docker run --rm simple-python-app:pr-${{ github.event.pull_request.number }}

      - name: Test Docker container internal logic
        run: |
          docker run --rm simple-python-app:pr-${{ github.event.pull_request.number }} python -c "from app import add, multiply, subtract; assert add(2, 3) == 5; assert multiply(2, 3) == 6; assert subtract(5, 2) == 3; print('Container validation passed!')"
